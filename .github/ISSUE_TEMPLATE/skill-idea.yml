name: Suggest an idea
description: Suggest a task the team repeats that could become a shared skill or other asset.
title: "Idea: "
labels: ["skill-idea"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the suggestion. Describe the task in general terms.
        **Do not paste client data, real names, real ticket keys or real flow exports.**
        Have a finished skill? Use the "Submit a skill or other asset" form instead.
  - type: textarea
    id: task
    attributes:
      label: The task you repeat
      description: What do you explain to your coding agent again and again?
    validations:
      required: true
  - type: textarea
    id: inputs
    attributes:
      label: What you give it
      description: The inputs you would hand over, for example a document, a list or a note.
    validations:
      required: false
  - type: textarea
    id: output
    attributes:
      label: What you want back
      description: The output you want, and the format the team uses.
    validations:
      required: true
  - type: checkboxes
    id: confidential
    attributes:
      label: Confidentiality
      options:
        - label: This contains no client data.
          required: true
