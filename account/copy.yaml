# Optional overrides for a few generic phrases. Leave a key out to use the default wording.
# The account lead's approval of the data rule is recorded in CLAUDE.md ("TO RECORD"), not on the page.
groundRules:
  data:
    title: Follow the account's data rules
    body: >-
      A skill is a set of instructions. It is not a different way of handling data.
      Anything you give your coding agent falls under the same client data rules as any other use of
      AI tools on the account. Ask your lead if you are unsure.

